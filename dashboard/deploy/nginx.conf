# ==============================================================================
# Nginx Reverse Proxy Configuration for Hydraulic System
# Path: /etc/nginx/sites-available/hydraulic-system
# Enable: sudo ln -s /etc/nginx/sites-available/hydraulic-system /etc/nginx/sites-enabled/
# ==============================================================================

# Rate limiting zone for auth endpoints to prevent brute-force attacks
limit_req_zone $binary_remote_addr zone=billing_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name billing.yourshop.com; # Replace with your VPS domain or public IP

    # Redirect all HTTP requests to HTTPS (managed by Certbot / Let's Encrypt)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name billing.yourshop.com; # Replace with your VPS domain or public IP

    # SSL Certificates (Certbot will manage these lines automatically)
    ssl_certificate /etc/letsencrypt/live/billing.yourshop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/billing.yourshop.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximum file upload size (for spreadsheet inventory imports)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Protect login endpoint with strict rate limiting
    location /api/auth/login {
        limit_req zone=billing_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Main Application Proxy
    location / {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy PDF and Excel report generation
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
