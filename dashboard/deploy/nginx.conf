# ==============================================================================
# Hardened Nginx Reverse Proxy Configuration for Hydraulic System
# Path: /etc/nginx/sites-available/hydraulic-system
# ==============================================================================

# Rate limiting zones to prevent brute force & denial of service
limit_req_zone $binary_remote_addr zone=billing_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=billing_pdf:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _; # Overridden with domain name in setup-vps.sh

    # ACME challenge for Let's Encrypt / Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Security Headers (Defense-in-depth)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum request body size (allows spreadsheet inventory imports)
    client_max_body_size 25M;

    # Gzip Compression for fast mobile rendering
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # 1. Protect authentication endpoints (Strict Rate Limiting)
    location /api/auth/login {
        limit_req zone=billing_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Protect PDF generation endpoints (Chromium/Puppeteer DoS Protection)
    location ~* /pdf$ {
        limit_req zone=billing_pdf burst=3 nodelay;
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # 3. Static assets caching (CSS, JS, Fonts, Images)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 4. Main Application Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts for large database reconciliations & reports
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
